name: Build VoltTune iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Capacitor iOS platform
        run: npx cap add ios || true

      - name: Sync web assets
        run: npx cap sync ios

      - name: Set version in all Info.plist files
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "Setting version to $VERSION"
          find ios -name "Info.plist" | while read f; do
            plutil -replace CFBundleShortVersionString -string "$VERSION" "$f" && echo "Patched: $f"
            plutil -replace CFBundleVersion -string "$VERSION" "$f"
          done

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build IPA
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $RUNNER_TEMP/VoltTune.xcarchive \
            archive \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            MARKETING_VERSION=$(node -e "console.log(require('../../package.json').version)") \
            CURRENT_PROJECT_VERSION=$(node -e "console.log(require('../../package.json').version)") \
            | xcpretty

      - name: Package IPA
        run: |
          APP_PATH=$(find $RUNNER_TEMP/VoltTune.xcarchive -name "*.app" | head -1)
          mkdir -p /tmp/Payload
          cp -r "$APP_PATH" /tmp/Payload/
          cd /tmp && zip -r VoltTune.ipa Payload/
          
          # Verify version in IPA
          cd /tmp && unzip -p VoltTune.ipa "Payload/*.app/Info.plist" | plutil -extract CFBundleShortVersionString raw -

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VoltTune-IPA
          path: /tmp/VoltTune.ipa
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: VoltTune v${{ github.run_number }}
          body: |
            ## VoltTune
            Download VoltTune.ipa and install via SideStore or AltStore.
          files: /tmp/VoltTune.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
